<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pivot – jeu abstrait à deux</title>
<style>
  :root {
    --papier: #E8EDF1;
    --feuille: #F7F9FB;
    --encre: #1B2430;
    --gris: #5D6B79;
    --trait: #C5D0DA;
    --rouge: #D4342C;
    --bleu: #1D4FD7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    color: var(--encre);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    background-color: var(--papier);
    /* effet cahier à carreaux */
    background-image:
      linear-gradient(var(--trait) 1px, transparent 1px),
      linear-gradient(90deg, var(--trait) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  .app {
    display: grid;
    grid-template-columns: minmax(0, 600px) 340px;
    gap: 32px;
    justify-content: center;
    max-width: 1040px;
    margin: 0 auto;
    padding: 24px 16px 40px;
  }
  @media (max-width: 880px) {
    .app { grid-template-columns: minmax(0, 600px); }
  }
  header { grid-column: 1 / -1; }
  h1 { margin: 0; font-size: 2.6rem; font-weight: 800; letter-spacing: -0.02em; }
  header p { margin: 4px 0 0; color: var(--gris); }

  .plateau {
    position: relative;
    background: var(--feuille);
    border: 2px solid var(--encre);
    border-radius: 6px;
    box-shadow: 6px 6px 0 var(--encre);
  }
  .plateau svg { display: block; width: 100%; height: auto; }
  .cible { cursor: pointer; outline: none; }
  .cible:focus-visible .halo-cible { stroke-width: 4; }
  .cible:hover .halo-cible { fill-opacity: 0.35; }
  .pulse { animation: pulse 1.8s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes pulse { 50% { opacity: 0.45; } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

  .voile {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; text-align: center;
    background: rgba(247, 249, 251, 0.92);
    border-radius: 4px;
  }
  .voile h2 { margin: 0; font-size: 2rem; }
  .voile p { margin: 0; max-width: 32ch; }

  .panneau { display: flex; flex-direction: column; gap: 14px; }
  .statut {
    background: var(--feuille);
    border: 2px solid var(--encre);
    border-radius: 6px;
    padding: 12px 14px;
  }
  .statut strong { display: block; font-size: 1.25rem; }
  .statut span { color: var(--gris); font-size: 0.95rem; }

  .carte {
    background: var(--feuille);
    border: 2px solid var(--trait);
    border-radius: 6px;
    padding: 10px 12px;
  }
  .carte.actif.R { border-color: var(--rouge); box-shadow: 4px 4px 0 var(--rouge); }
  .carte.actif.B { border-color: var(--bleu); box-shadow: 4px 4px 0 var(--bleu); }
  .carte-tete { display: flex; align-items: center; gap: 8px; }
  .pastille { width: 14px; height: 14px; border-radius: 50%; flex: none; }
  .R .pastille { background: var(--rouge); }
  .B .pastille { background: var(--bleu); }
  .camp { margin-left: auto; color: var(--gris); font-size: 0.9rem; }
  .stock { margin-top: 6px; font-size: 0.95rem; color: var(--gris); }
  .pts { letter-spacing: 2px; color: var(--encre); margin-right: 12px; }

  .modes { display: grid; grid-template-columns: 1fr; gap: 8px; }
  button {
    font: inherit;
    padding: 9px 12px;
    background: var(--feuille);
    color: var(--encre);
    border: 2px solid var(--encre);
    border-radius: 6px;
    cursor: pointer;
    text-align: left;
  }
  button:hover:not(:disabled) { background: #fff; }
  button:focus-visible { outline: 3px solid var(--encre); outline-offset: 2px; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.choisi { background: var(--encre); color: var(--feuille); }
  .rang { display: flex; gap: 8px; }
  .rang button { flex: 1; text-align: center; }
  .aide { margin: 0; font-size: 0.95rem; color: var(--gris); line-height: 1.45; }
  .echange { border: 2px solid var(--encre); border-radius: 6px; padding: 12px; background: #fff; }
  .echange p { margin: 0 0 10px; }

  details { background: var(--feuille); border: 2px solid var(--trait); border-radius: 6px; padding: 10px 12px; }
  summary { cursor: pointer; font-weight: 700; }
  details ul { margin: 8px 0 0; padding-left: 18px; line-height: 1.5; font-size: 0.95rem; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Pivot</h1>
    <p>Un pivot, deux axes. Piège ton adversaire jusqu’à ce qu’il ne puisse plus bouger.</p>
  </header>

  <div class="plateau" id="plateau"></div>

  <div class="panneau" id="panneau"></div>
</div>

<script>
/* =====================================================================
   PIVOT – jeu à deux sur le même écran
   Le code est découpé en 5 parties :
   1. Constantes
   2. État de la partie (les données)
   3. Règles (fonctions qui ne touchent pas à l'affichage)
   4. Actions du joueur (glisser, borne, virage, échange, annuler)
   5. Affichage (dessin du plateau et du panneau)
   ===================================================================== */

/* ---------- 1. Constantes ---------- */
const N = 7;                       // taille de la grille : 7 x 7 points
const LETTRES = "ABCDEFG";         // noms des colonnes
const PAS = 72;                    // espace entre deux points (en pixels SVG)
const MARGE = 56;                  // marge autour de la grille
const TAILLE = 2 * MARGE + (N - 1) * PAS;
const COULEUR = { R: "#D4342C", B: "#1D4FD7" };
const NOM_COULEUR = { R: "Rouge", B: "Bleu" };
const ENCRE = "#1B2430";

/* ---------- 2. État de la partie ---------- */
let etat;                          // toutes les données de la partie en cours
let historique = [];               // copies de l'état pour pouvoir annuler
let mode = "glisser";              // "glisser", "borne" ou "virage"

function nouvelEtat() {
  // cases[y][x] vaut null si le point est libre,
  // sinon un objet { type: "trace" ou "borne", cote: "R" ou "B" ou null }
  const cases = [];
  for (let y = 0; y < N; y++) {
    cases.push([]);
    for (let x = 0; x < N; x++) cases[y].push(null);
  }
  const centre = Math.floor(N / 2);
  cases[centre][centre] = { type: "trace", cote: null };   // le départ est bloqué

  return {
    cases: cases,
    pivot: { x: centre, y: centre },
    traits: [],                                   // les trajets tracés
    tour: "R",                                    // c'est à Rouge de commencer
    stock: { R: { bornes: 3, virage: 1 }, B: { bornes: 3, virage: 1 } },
    noms: { R: "Joueur 1", B: "Joueur 2" },       // qui joue quel camp
    coups: 0,                                     // nombre d'actions jouées
    attenteEchange: false,                        // Bleu doit choisir : garder ou échanger ?
    gagnant: null                                 // "R", "B" ou null
  };
}

/* ---------- 3. Règles ---------- */
const autre = (cote) => (cote === "R" ? "B" : "R");
const axeDe = (cote) => (cote === "R" ? "H" : "V");     // Rouge = horizontal, Bleu = vertical
const dansGrille = (x, y) => x >= 0 && x < N && y >= 0 && y < N;
const nomCase = (x, y) => LETTRES[x] + (y + 1);

// Liste des points où le pivot peut aller en glissant sur l'axe donné ("H" ou "V").
function destinations(e, axe) {
  const directions = axe === "H" ? [[-1, 0], [1, 0]] : [[0, -1], [0, 1]];
  const resultat = [];
  for (const [dx, dy] of directions) {
    let x = e.pivot.x + dx;
    let y = e.pivot.y + dy;
    // on avance tant que le point est dans la grille ET libre
    while (dansGrille(x, y) && e.cases[y][x] === null) {
      resultat.push({ x: x, y: y });
      x += dx;
      y += dy;
    }
  }
  return resultat;
}

// Tous les points libres (pour poser une borne).
function pointsLibres(e) {
  const resultat = [];
  for (let y = 0; y < N; y++)
    for (let x = 0; x < N; x++)
      if (e.cases[y][x] === null) resultat.push({ x: x, y: y });
  return resultat;
}

// Le joueur dont c'est le tour a-t-il au moins un mouvement ? (glisser ou virage)
function peutBouger(e, cote) {
  if (destinations(e, axeDe(cote)).length > 0) return true;
  return e.stock[cote].virage > 0 && destinations(e, axeDe(autre(cote))).length > 0;
}

function verifierDefaite(e) {
  if (!peutBouger(e, e.tour)) e.gagnant = autre(e.tour);
}

/* ---------- 4. Actions du joueur ---------- */
function copie(objet) { return JSON.parse(JSON.stringify(objet)); }
function sauvegarder() { historique.push(copie(etat)); }

// Choisit le mode par défaut : "glisser", sauf si le joueur ne peut que faire un virage.
function modeParDefaut() {
  mode = "glisser";
  if (!etat.gagnant && !etat.attenteEchange &&
      destinations(etat, axeDe(etat.tour)).length === 0) {
    mode = "virage";
  }
}

// Fin d'une action : on passe la main.
function finDeTour() {
  etat.coups += 1;
  etat.tour = autre(etat.tour);
  if (etat.coups === 1) {
    etat.attenteEchange = true;     // règle d'équilibre : Bleu peut échanger les camps
  } else {
    verifierDefaite(etat);
  }
  modeParDefaut();
  dessiner();
}

// Déplace le pivot jusqu'au point (x, y) et marque tout le trajet.
function deplacerPivot(x, y) {
  const cote = etat.tour;
  const dx = Math.sign(x - etat.pivot.x);
  const dy = Math.sign(y - etat.pivot.y);
  let cx = etat.pivot.x;
  let cy = etat.pivot.y;
  while (cx !== x || cy !== y) {
    cx += dx;
    cy += dy;
    etat.cases[cy][cx] = { type: "trace", cote: cote };
  }
  etat.traits.push({ x1: etat.pivot.x, y1: etat.pivot.y, x2: x, y2: y, cote: cote });
  etat.pivot = { x: x, y: y };
}

// Le joueur clique sur le point (x, y) du plateau.
function cliquerPoint(x, y) {
  if (etat.gagnant || etat.attenteEchange) return;
  const cote = etat.tour;

  if (mode === "borne") {
    if (etat.stock[cote].bornes <= 0 || etat.cases[y][x] !== null) return;
    sauvegarder();
    etat.cases[y][x] = { type: "borne", cote: cote };
    etat.stock[cote].bornes -= 1;
    finDeTour();
    return;
  }

  // glisser ou virage : l'axe change selon le mode
  const axe = mode === "virage" ? axeDe(autre(cote)) : axeDe(cote);
  const valide = destinations(etat, axe).some((d) => d.x === x && d.y === y);
  if (!valide) return;
  if (mode === "virage" && etat.stock[cote].virage <= 0) return;

  sauvegarder();
  deplacerPivot(x, y);
  if (mode === "virage") etat.stock[cote].virage -= 1;
  finDeTour();
}

// Bleu choisit après le premier coup : garder son camp ou échanger.
function choisirEchange(echanger) {
  sauvegarder();
  if (echanger) {
    const temp = etat.noms.R;
    etat.noms.R = etat.noms.B;
    etat.noms.B = temp;
  }
  etat.attenteEchange = false;
  verifierDefaite(etat);
  modeParDefaut();
  dessiner();
}

function annuler() {
  if (historique.length === 0) return;
  etat = historique.pop();
  modeParDefaut();
  dessiner();
}

function nouvellePartie() {
  if (etat.coups > 0 && !etat.gagnant &&
      !window.confirm("Recommencer une nouvelle partie ?")) return;
  etat = nouvelEtat();
  historique = [];
  modeParDefaut();
  dessiner();
}

/* ---------- 5. Affichage ---------- */
const px = (i) => MARGE + i * PAS;     // position en pixels d'un index de grille

function dessinerPlateau() {
  const cote = etat.tour;
  const couleurTour = COULEUR[cote];
  let s = "";

  // quadrillage
  for (let i = 0; i < N; i++) {
    s += `<line x1="${px(i)}" y1="${px(0)}" x2="${px(i)}" y2="${px(N - 1)}" stroke="#C5D0DA" stroke-width="1.5"/>`;
    s += `<line x1="${px(0)}" y1="${px(i)}" x2="${px(N - 1)}" y2="${px(i)}" stroke="#C5D0DA" stroke-width="1.5"/>`;
  }

  // lettres (colonnes) et chiffres (lignes)
  for (let i = 0; i < N; i++) {
    s += `<text x="${px(i)}" y="${MARGE - 26}" text-anchor="middle" font-size="16" fill="#5D6B79">${LETTRES[i]}</text>`;
    s += `<text x="${px(i)}" y="${TAILLE - MARGE + 38}" text-anchor="middle" font-size="16" fill="#5D6B79">${LETTRES[i]}</text>`;
    s += `<text x="${MARGE - 34}" y="${px(i) + 5}" text-anchor="middle" font-size="16" fill="#5D6B79">${i + 1}</text>`;
    s += `<text x="${TAILLE - MARGE + 34}" y="${px(i) + 5}" text-anchor="middle" font-size="16" fill="#5D6B79">${i + 1}</text>`;
  }

  // trajets déjà tracés
  for (const t of etat.traits) {
    s += `<line x1="${px(t.x1)}" y1="${px(t.y1)}" x2="${px(t.x2)}" y2="${px(t.y2)}" stroke="${COULEUR[t.cote]}" stroke-width="7" stroke-linecap="round" opacity="0.85"/>`;
  }

  // aperçu du trajet au survol (rempli par le JavaScript plus bas)
  s += `<line id="apercu" x1="0" y1="0" x2="0" y2="0" stroke="${couleurTour}" stroke-width="7" stroke-linecap="round" opacity="0.35" visibility="hidden"/>`;

  // points : libres, visités ou bornes
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      const c = etat.cases[y][x];
      if (c === null) {
        s += `<circle cx="${px(x)}" cy="${px(y)}" r="4" fill="#8795A3"/>`;
      } else if (c.type === "trace") {
        const couleur = c.cote ? COULEUR[c.cote] : ENCRE;
        s += `<circle cx="${px(x)}" cy="${px(y)}" r="6" fill="${couleur}"/>`;
      } else {
        const couleur = COULEUR[c.cote];
        const a = 11;
        s += `<g stroke="${couleur}" stroke-width="5" stroke-linecap="round">` +
             `<line x1="${px(x) - a}" y1="${px(y) - a}" x2="${px(x) + a}" y2="${px(y) + a}"/>` +
             `<line x1="${px(x) - a}" y1="${px(y) + a}" x2="${px(x) + a}" y2="${px(y) - a}"/></g>`;
      }
    }
  }

  // cibles cliquables selon le mode choisi
  if (!etat.gagnant && !etat.attenteEchange) {
    let cibles;
    if (mode === "borne") cibles = pointsLibres(etat);
    else if (mode === "virage") cibles = destinations(etat, axeDe(autre(cote)));
    else cibles = destinations(etat, axeDe(cote));

    for (const d of cibles) {
      s += `<g class="cible" data-x="${d.x}" data-y="${d.y}" tabindex="0" role="button" aria-label="${nomCase(d.x, d.y)}">` +
           `<circle class="halo-cible" cx="${px(d.x)}" cy="${px(d.y)}" r="17" fill="${couleurTour}" fill-opacity="0.15" stroke="${couleurTour}" stroke-width="2.5" stroke-dasharray="4 3"/>` +
           `<circle cx="${px(d.x)}" cy="${px(d.y)}" r="30" fill="transparent"/></g>`;
    }
  }

  // le pivot
  s += `<circle class="pulse" cx="${px(etat.pivot.x)}" cy="${px(etat.pivot.y)}" r="24" fill="${couleurTour}" opacity="0.3"/>`;
  s += `<circle cx="${px(etat.pivot.x)}" cy="${px(etat.pivot.y)}" r="14" fill="${ENCRE}"/>`;
  s += `<circle cx="${px(etat.pivot.x)}" cy="${px(etat.pivot.y)}" r="5" fill="#F7F9FB"/>`;

  let voile = "";
  if (etat.gagnant) {
    const g = etat.gagnant;
    voile = `<div class="voile"><h2 style="color:${COULEUR[g]}">${etat.noms[g]} gagne !</h2>` +
            `<p>${etat.noms[autre(g)]} (${NOM_COULEUR[autre(g)]}) est bloqué : plus aucun glissement ni virage possible.</p>` +
            `<button data-action="nouvelle">Rejouer</button></div>`;
  }

  document.getElementById("plateau").innerHTML =
    `<svg viewBox="0 0 ${TAILLE} ${TAILLE}" role="group" aria-label="Plateau de jeu 7 par 7">${s}</svg>${voile}`;
}

const pastilles = (n, max) => "●".repeat(n) + "○".repeat(max - n);

function carteJoueur(cote) {
  const actif = etat.tour === cote && !etat.gagnant && !etat.attenteEchange;
  const s = etat.stock[cote];
  return `<div class="carte ${cote} ${actif ? "actif" : ""}">` +
    `<div class="carte-tete"><span class="pastille"></span><strong>${etat.noms[cote]}</strong>` +
    `<span class="camp">${NOM_COULEUR[cote]} ${cote === "R" ? "↔ horizontal" : "↕ vertical"}</span></div>` +
    `<div class="stock">Bornes <span class="pts">${pastilles(s.bornes, 3)}</span>` +
    `Virage <span class="pts">${pastilles(s.virage, 1)}</span></div></div>`;
}

function dessinerPanneau() {
  const cote = etat.tour;
  let statut;
  if (etat.gagnant) {
    statut = `<strong>${etat.noms[etat.gagnant]} gagne</strong><span>La partie est terminée.</span>`;
  } else if (etat.attenteEchange) {
    statut = `<strong>Choix des camps</strong><span>Le premier coup est joué. ${etat.noms.B} décide.</span>`;
  } else {
    const sens = cote === "R" ? "à gauche ou à droite" : "en haut ou en bas";
    statut = `<strong>À ${etat.noms[cote]} de jouer</strong><span>${NOM_COULEUR[cote]} : le pivot glisse ${sens}.</span>`;
  }

  let bloc = "";
  if (etat.attenteEchange) {
    bloc = `<div class="echange"><p>${etat.noms.B}, tu joues Bleu (vertical). Tu peux aussi prendre le camp de ${etat.noms.R} (Rouge, horizontal), qui jouera alors Bleu et reprendra la main.</p>` +
           `<div class="rang"><button data-action="garder">Garder Bleu</button><button data-action="echanger">Prendre Rouge</button></div></div>`;
  } else if (!etat.gagnant) {
    const s = etat.stock[cote];
    const peutBorne = s.bornes > 0 && pointsLibres(etat).length > 0;
    const peutVirage = s.virage > 0 && destinations(etat, axeDe(autre(cote))).length > 0;
    const peutGlisser = destinations(etat, axeDe(cote)).length > 0;
    const aides = {
      glisser: "Clique sur un point entouré pour y envoyer le pivot.",
      borne: "Clique sur un point libre pour y poser une borne. Le pivot ne bouge pas.",
      virage: "Virage : le pivot glisse sur l’axe de ton adversaire. Tu n’en as qu’un seul."
    };
    bloc = `<div class="modes">` +
      `<button data-mode="glisser" class="${mode === "glisser" ? "choisi" : ""}" ${peutGlisser ? "" : "disabled"}>Glisser</button>` +
      `<button data-mode="borne" class="${mode === "borne" ? "choisi" : ""}" ${peutBorne ? "" : "disabled"}>Poser une borne (${s.bornes} restantes)</button>` +
      `<button data-mode="virage" class="${mode === "virage" ? "choisi" : ""}" ${peutVirage ? "" : "disabled"}>Faire un virage (${s.virage} restant)</button>` +
      `</div><p class="aide">${aides[mode]}</p>`;
  }

  const regles = `<details><summary>Rappel des règles</summary><ul>` +
    `<li>Rouge glisse le pivot à l’horizontale, Bleu à la verticale, d’au moins 1 pas.</li>` +
    `<li>Les points visités, les bornes et les bords sont bloqués : on ne les traverse pas.</li>` +
    `<li>À ton tour : glisser, poser une borne (3 fois) ou faire un virage (1 fois, axe de l’adversaire).</li>` +
    `<li>Si tu ne peux ni glisser ni faire de virage, tu perds.</li>` +
    `<li>Après le premier coup, Bleu peut échanger les camps.</li></ul></details>`;

  document.getElementById("panneau").innerHTML =
    `<div class="statut">${statut}</div>` +
    carteJoueur("R") + carteJoueur("B") + bloc +
    `<div class="rang"><button data-action="annuler" ${historique.length ? "" : "disabled"}>Annuler</button>` +
    `<button data-action="nouvelle">Nouvelle partie</button></div>` + regles;
}

function dessiner() {
  dessinerPlateau();
  dessinerPanneau();
}

/* ---------- Écouteurs d'événements ---------- */
const plateau = document.getElementById("plateau");
const panneau = document.getElementById("panneau");

plateau.addEventListener("click", (ev) => {
  const bouton = ev.target.closest("[data-action]");
  if (bouton && bouton.dataset.action === "nouvelle") { nouvellePartie(); return; }
  const cible = ev.target.closest(".cible");
  if (cible) cliquerPoint(Number(cible.dataset.x), Number(cible.dataset.y));
});

plateau.addEventListener("keydown", (ev) => {
  if (ev.key !== "Enter" && ev.key !== " ") return;
  const cible = ev.target.closest(".cible");
  if (cible) {
    ev.preventDefault();
    cliquerPoint(Number(cible.dataset.x), Number(cible.dataset.y));
  }
});

// aperçu du trajet quand on survole (ou qu'on sélectionne au clavier) une cible
function montrerApercu(ev) {
  const apercu = document.getElementById("apercu");
  if (!apercu) return;
  const cible = ev.target.closest ? ev.target.closest(".cible") : null;
  if (cible && mode !== "borne") {
    apercu.setAttribute("x1", px(etat.pivot.x));
    apercu.setAttribute("y1", px(etat.pivot.y));
    apercu.setAttribute("x2", px(Number(cible.dataset.x)));
    apercu.setAttribute("y2", px(Number(cible.dataset.y)));
    apercu.setAttribute("visibility", "visible");
  } else {
    apercu.setAttribute("visibility", "hidden");
  }
}
plateau.addEventListener("mouseover", montrerApercu);
plateau.addEventListener("mouseout", montrerApercu);
plateau.addEventListener("focusin", montrerApercu);
plateau.addEventListener("focusout", montrerApercu);

panneau.addEventListener("click", (ev) => {
  const bouton = ev.target.closest("button");
  if (!bouton || bouton.disabled) return;
  if (bouton.dataset.mode) { mode = bouton.dataset.mode; dessiner(); return; }
  const action = bouton.dataset.action;
  if (action === "garder") choisirEchange(false);
  else if (action === "echanger") choisirEchange(true);
  else if (action === "annuler") annuler();
  else if (action === "nouvelle") nouvellePartie();
});

/* ---------- Démarrage ---------- */
etat = nouvelEtat();
modeParDefaut();
dessiner();
</script>
