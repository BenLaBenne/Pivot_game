<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIVOT Online — Inscription</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <a href="/" class="logo">PIVOT</a>
    <nav>
      <a href="/login">Connexion</a>
      <a href="/leaderboard">Classement</a>
    </nav>
  </div>

  <div class="card" style="max-width:460px;margin:32px auto;">
    <h2 style="text-align:center;color:var(--bleu-fonce);">Créer un compte</h2>
    <form id="form-signup">
      <div class="form-group">
        <label for="pseudo">Pseudo (3-32 caractères alphanumériques)</label>
        <input type="text" id="pseudo" autocomplete="username" required
               pattern="[a-zA-Z0-9_]{3,32}" title="3 à 32 caractères alphanumériques">
      </div>
      <div class="form-group">
        <label for="password">Mot de passe (minimum 6 caractères)</label>
        <input type="password" id="password" autocomplete="new-password" required minlength="6">
      </div>
      <div class="form-group">
        <label for="password2">Confirme le mot de passe</label>
        <input type="password" id="password2" autocomplete="new-password" required minlength="6">
      </div>
      <button type="submit" class="btn btn-vert btn-large">S'inscrire</button>
      <p class="muted center mt-2">Déjà un compte ? <a href="/login" style="color:var(--orange);font-weight:800;">Connecte-toi</a></p>
      <p class="muted center">Bonus de départ : 1 virage gratuit (pour ne jamais être bloqué).</p>
    </form>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/api.js"></script>
<script>
const form = document.getElementById('form-signup');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const pseudo = document.getElementById('pseudo').value.trim();
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;
  if (password !== password2) { PIVOT.toast('Les mots de passe ne correspondent pas.', 'error'); return; }
  try {
    const r = await PIVOT.api('POST', '/auth/signup', { pseudo, password });
    PIVOT.setToken(r.token);
    PIVOT.setUser(r.user);
    PIVOT.toast('Compte créé, bienvenue ' + r.user.pseudo + ' !');
    setTimeout(() => window.location.href = '/', 500);
  } catch (err) {
    PIVOT.toast(err.message, 'error');
  }
});
</script>
</body>
</html>
