<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIVOT Online — Tournois</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <a href="/" class="logo">PIVOT</a>
    <nav>
      <a href="/play">Jouer</a>
      <a href="/tournaments">Tournois</a>
      <a href="/shop">Boutique</a>
      <a href="/leaderboard">Classement</a>
      <a href="/" id="btn-home">← Accueil</a>
    </nav>
  </div>

  <div class="card">
    <h2 style="color:var(--bleu-fonce);">🏆 Tournois publics</h2>
    <p class="muted mb-2">Format bracket à élimination. Min 3 joueurs, max 20. Récompenses boostées.</p>
    <button class="btn btn-vert mb-2" id="btn-create-tournament">+ Créer un tournoi</button>
    <div id="liste-tournois" class="col"></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/api.js"></script>
<script>
if (PIVOT.redirectIfLoggedOut()) {} else {
  chargerTournois();
}

async function chargerTournois() {
  const cont = document.getElementById('liste-tournois');
  try {
    const r = await PIVOT.api('GET', '/tournaments');
    if (r.tournois.length === 0) {
      cont.innerHTML = '<p class="muted">Aucun tournoi en attente. Crée le premier !</p>';
      return;
    }
    cont.innerHTML = r.tournois.map(t => `
      <div class="card">
        <h3 style="color:var(--bleu-fonce);">${escapeHtml(t.name)}</h3>
        <p class="muted">Créé par ${escapeHtml(t.creator_pseudo)} • ${t.nb_inscrits}/${t.max_players} joueurs • statut: ${t.status}</p>
        <button class="btn btn-mini" onclick="window.location.href='/tournament/${t.id}'">Voir / Rejoindre</button>
      </div>
    `).join('');
  } catch (e) { PIVOT.toast(e.message, 'error'); }
}

document.getElementById('btn-create-tournament').addEventListener('click', async () => {
  const name = prompt('Nom du tournoi (3-64 caractères) :');
  if (!name) return;
  const isPrivate = confirm('Tournoi privé (avec code) ?');
  try {
    const r = await PIVOT.api('POST', '/tournaments', { name, isPrivate });
    PIVOT.toast('Tournoi créé !');
    setTimeout(() => window.location.href = '/tournament/' + r.tournoi.id, 700);
  } catch (e) { PIVOT.toast(e.message, 'error'); }
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
</script>
</body>
</html>
