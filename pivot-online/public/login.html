<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIVOT Online — Connexion</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <a href="/" class="logo">PIVOT</a>
    <nav>
      <a href="/signup">Inscription</a>
      <a href="/leaderboard">Classement</a>
    </nav>
  </div>

  <div class="card" style="max-width:420px;margin:32px auto;">
    <h2 style="text-align:center;color:var(--bleu-fonce);">Connexion</h2>
    <form id="form-login">
      <div class="form-group">
        <label for="pseudo">Pseudo</label>
        <input type="text" id="pseudo" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-bleu btn-large">Se connecter</button>
      <p class="muted center mt-2">Pas encore de compte ? <a href="/signup" style="color:var(--orange);font-weight:800;">Crée-en un</a></p>
    </form>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/api.js"></script>
<script>
const form = document.getElementById('form-login');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    const pseudo = document.getElementById('pseudo').value.trim();
    const password = document.getElementById('password').value;
    const r = await PIVOT.api('POST', '/auth/login', { pseudo, password });
    PIVOT.setToken(r.token);
    PIVOT.setUser(r.user);
    PIVOT.toast('Bienvenue ' + r.user.pseudo + ' !');
    setTimeout(() => window.location.href = '/', 500);
  } catch (err) {
    PIVOT.toast(err.message, 'error');
  }
});
</script>
</body>
</html>
